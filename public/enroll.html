<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Set up a passkey · Agent Inbox</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <h1>Agent Inbox</h1>
    </header>

    <main>
      <section class="panel">
        <h2>Set up a passkey</h2>
        <p class="muted">
          Saves a passkey for this inbox on this device (Face ID, Touch ID or your device PIN).
          This setup link works once.
        </p>
        <button id="create" type="button">Create passkey</button>
        <p id="status" class="muted" role="status"></p>
      </section>
    </main>

    <script src="/enroll.js" type="module"></script>
  </body>
</html>
